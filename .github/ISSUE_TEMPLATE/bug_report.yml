name: Bug report
description: Report a problem with Catchlight for Mac
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Please don't include your Privacy phrase, Take contents, or any
        personal data.** Catchlight is zero-knowledge and I never need any of it to help you.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Catchlight → About Catchlight (e.g. 1.0.0)
    validations:
      required: false
  - type: input
    id: macos-mac
    attributes:
      label: macOS version & Mac
      placeholder: "macOS 26.0, MacBook Air M2"
    validations:
      required: false
  - type: checkboxes
    id: privacy-check
    attributes:
      label: Privacy check
      options:
        - label: I have not included my Privacy phrase, Take contents, or other personal data.
          required: true

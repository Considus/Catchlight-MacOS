name: Feature request
description: Suggest an idea for Catchlight for Mac
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the need or frustration behind the request.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like Catchlight to do?
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        Catchlight's non-negotiables (zero-knowledge, encryption always on, offline-first, no
        telemetry) are fixed, and the README lists them. A request that conflicts with one of them
        can't be accepted.

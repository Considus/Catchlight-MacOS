# project.yml — XcodeGen specification for the Catchlight Mac app.
#
# The .xcodeproj is generated from this file and is not checked in (.gitignore),
# as in Catchlight-iOS:
#
#   brew install xcodegen   # one-time
#   xcodegen generate       # produces Catchlight.xcodeproj
#
# Scope and decisions: Mac_Shell_Plan and D-343 — App Sandbox on, XcodeGen, and from M2
# Core and the shared Apple storage as packages pinned to exact tags.

name: Catchlight
options:
  bundleIdPrefix: com.considus
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    # D-317: development builds are universal so they run on the Intel Mac;
    # release builds are Apple Silicon only.
    Debug:
      ARCHS: "$(ARCHS_STANDARD)"
      ONLY_ACTIVE_ARCH: NO
    Release:
      ARCHS: arm64

packages:
  # The platform-agnostic core (model, file format, crypto, sync), pinned to an exact tag so
  # a Core change reaches the Mac only through a deliberate bump (D-344, D-350).
  CatchlightCore:
    url: https://github.com/Considus/Catchlight-Core
    # 1.4.0: sync(holding:), so a Take waiting for a conflict choice is never uploaded or
    # overwritten (Catchlight-Core#27).
    exactVersion: 1.4.0
  # The encrypted SQLite store, the Keychain items and the BIP-39 wordlist, shared with the
  # iPhone app so the two can't drift. From 1.4.0 it takes any Core 1.x
  # (Catchlight-AppleStorage#13), so a Core bump no longer needs a matching one here.
  CatchlightAppleStorage:
    url: https://github.com/Considus/Catchlight-AppleStorage
    exactVersion: 1.4.0

targets:
  Catchlight:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      # The shared interface, copied into the bundle as Contents/Resources/ui on
      # every build. A folder reference rather than a group, so a file added to
      # ui/ is picked up without regenerating the project and the bundle always
      # matches the repo. Never copy it by hand.
      - path: ui
        type: folder
        buildPhase: resources
    info:
      # XcodeGen rewrites this file from the properties below on every
      # `generate`. Edit them here, not the plist.
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Catchlight
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSApplicationCategoryType: public.app-category.productivity
        NSPrincipalClass: NSApplication
    entitlements:
      # Rewritten by XcodeGen from these properties too.
      path: App/Resources/Catchlight.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # WebKit needs this even though the page loads nothing off the device.
        # Its Networking, GPU and WebContent helpers run under the host app's
        # sandbox, and without the network client entitlement they crash at
        # launch and the window stays blank (measured 2026-10-03, macOS 15.8:
        # four process terminations without it, none with it). It is an OS
        # permission, not traffic: ui/ is served from the bundle through the
        # catchlight:// scheme, and MainWindowController refuses navigation to
        # any other scheme.
        com.apple.security.network.client: true
        # The master key and the Privacy phrase live in the data-protection keychain under
        # the same group the iPhone uses (Catchlight-AppleStorage, KeychainConfig). On macOS
        # this is a restricted entitlement, granted only by a provisioning profile, which is
        # why the app is signed for the team rather than ad hoc.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.considus.catchlight
        # The sync folder (M3): read and write the folder the user picks in the open panel,
        # and keep a security-scoped bookmark to it so the app can reach it again after a
        # relaunch. Only that folder: the sandbox still keeps the rest of the disk out.
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    # Stamp CFBundleVersion with the git short SHA, as the iPhone app does, so
    # scripts/device/device.py can tell which commit is installed: otherwise every
    # build reads "0.1.0 (1)". A postBuildScript, because Process Info.plist runs
    # after postCompile and would rewrite the stamp; postBuild runs after it and
    # before signing, so the signature covers the stamp. It holds on a CLEAN build
    # only (as on the iPhone): an incremental build re-runs Process Info.plist after
    # the stamp and leaves "1", which is why device.py always builds into fresh
    # derived data. Archives keep the numeric build number, and a build with no git
    # (a CI source archive) keeps "1".
    postBuildScripts:
      - name: "Stamp build number with git short SHA"
        basedOnDependencyAnalysis: false
        script: |
          if [ "${ACTION}" = "install" ]; then
            echo "note: archive build — keeping numeric CFBundleVersion"
            exit 0
          fi
          GIT=$(command -v git || true)
          if [ -z "$GIT" ]; then
            echo "note: git not found — leaving CFBundleVersion as-is"
            exit 0
          fi
          SHA=$("$GIT" -C "$SRCROOT" rev-parse --short HEAD 2>/dev/null || true)
          if [ -z "$SHA" ]; then
            echo "note: not a git checkout — leaving CFBundleVersion as-is"
            exit 0
          fi
          if [ -n "$("$GIT" -C "$SRCROOT" status --porcelain 2>/dev/null)" ]; then
            SHA="${SHA}+dirty"
          fi
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          if [ ! -f "$PLIST" ]; then
            echo "note: built Info.plist not found at $PLIST — skipping SHA stamp"
            exit 0
          fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $SHA" "$PLIST"
          echo "note: stamped CFBundleVersion = $SHA"
    dependencies:
      - package: CatchlightCore
        product: CatchlightCore
      - package: CatchlightAppleStorage
        product: CatchlightAppleStorage
    settings:
      base:
        # The stamp script above reads the git checkout and writes the built
        # Info.plist, which the build-script sandbox blocks, so it is off for this
        # target only; the test bundle keeps the project-level YES.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.considus.catchlight.mac
        PRODUCT_NAME: Catchlight
        CODE_SIGN_ENTITLEMENTS: App/Resources/Catchlight.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        # Signed for the team (M2, owner 2026-10-03): the Keychain entitlement above
        # needs a provisioning profile, which automatic signing fetches. Developer ID
        # for distribution comes in M5. CI passes CODE_SIGNING_ALLOWED=NO and its
        # tests use in-memory secrets, so it needs no certificate.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YTPP9HU9F9
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES

  # Unit tests. They compile the app's sources directly rather than loading into the app, so
  # nothing launches, and run unsigned in CI. WKWebView tests serve the repo's own ui/.
  CatchlightTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App/Sources
        excludes:
          - main.swift
      - path: App/Tests
    dependencies:
      - package: CatchlightCore
        product: CatchlightCore
      - package: CatchlightCore
        product: CatchlightCoreTestSupport
      - package: CatchlightAppleStorage
        product: CatchlightAppleStorage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.considus.catchlight.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""

schemes:
  Catchlight:
    build:
      targets:
        Catchlight: all
    test:
      targets:
        - CatchlightTests
